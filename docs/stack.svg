<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Stack: Next.js frontend, FastAPI backend, Claude Sonnet 5.5</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9bfd9"/>
    </marker>
  </defs>

  <rect width="980" height="230" rx="18" fill="#15101f"/>

  <!-- frontend -->
  <rect x="40" y="55" width="210" height="120" rx="14" fill="#211933" stroke="#9b6bd6" stroke-width="2"/>
  <text x="145" y="98" text-anchor="middle" fill="#f4f1ea" font-size="18" font-weight="700">Next.js frontend</text>
  <text x="145" y="124" text-anchor="middle" fill="#c9bfd9" font-size="13">React + three.js</text>
  <text x="145" y="145" text-anchor="middle" fill="#c9bfd9" font-size="13">paints the shader live</text>

  <!-- backend -->
  <rect x="385" y="55" width="210" height="120" rx="14" fill="#211933" stroke="#a6cd72" stroke-width="2"/>
  <text x="490" y="98" text-anchor="middle" fill="#f4f1ea" font-size="18" font-weight="700">FastAPI backend</text>
  <text x="490" y="124" text-anchor="middle" fill="#c9bfd9" font-size="13">Python</text>
  <text x="490" y="145" text-anchor="middle" fill="#c9bfd9" font-size="13">/gen-shader  /fix-shader</text>

  <!-- model -->
  <rect x="730" y="55" width="210" height="120" rx="14" fill="#211933" stroke="#ff8a2a" stroke-width="2"/>
  <text x="835" y="98" text-anchor="middle" fill="#f4f1ea" font-size="18" font-weight="700">Claude Sonnet 5.5</text>
  <text x="835" y="124" text-anchor="middle" fill="#c9bfd9" font-size="13">Anthropic API</text>
  <text x="835" y="145" text-anchor="middle" fill="#c9bfd9" font-size="13">writes the GLSL</text>

  <!-- frontend <-> backend -->
  <line x1="256" y1="100" x2="379" y2="100" stroke="#c9bfd9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="317" y="90" text-anchor="middle" fill="#f4f1ea" font-size="12">your answer</text>
  <line x1="379" y1="132" x2="256" y2="132" stroke="#c9bfd9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="317" y="152" text-anchor="middle" fill="#f4f1ea" font-size="12">shader + colors</text>

  <!-- backend <-> model -->
  <line x1="601" y1="100" x2="724" y2="100" stroke="#c9bfd9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="90" text-anchor="middle" fill="#f4f1ea" font-size="12">prompt + schema</text>
  <line x1="724" y1="132" x2="601" y2="132" stroke="#c9bfd9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="152" text-anchor="middle" fill="#f4f1ea" font-size="12">JSON</text>
</svg>
